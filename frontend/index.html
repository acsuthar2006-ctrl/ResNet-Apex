<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry AI Assistant</title>
    <meta name="description" content="AI-powered clothing detector ChatBot">

    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Material Symbols / Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
    <!-- Dynamic background elements for premium feel -->
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-info">
                <h1>Laundry AI Scanner</h1>
                <p>AI-Powered Clothing Classifier</p>
            </div>
            <button class="settings-btn" aria-label="Settings">
                <span class="material-symbols-outlined">settings</span>
            </button>
        </header>

        <div class="dashboard-content">
            <!-- State 1: Upload Zone -->
            <div id="upload-zone" class="upload-zone active">
                <span class="material-symbols-outlined upload-icon">cloud_upload</span>
                <h2>Upload an Image</h2>
                <p>Drag and drop or browse to scan clothing items.</p>
                <label for="file-upload" class="upload-btn-main">Browse Files</label>
                <input type="file" id="file-upload" accept="image/jpeg, image/png, image/webp" hidden>
            </div>

            <!-- State 2: Scanning / Results -->
            <div id="results-zone" class="results-zone hidden">
                <div class="image-panel">
                    <div class="image-overlay-container" id="image-overlay-container">
                        <img id="scanned-img" src="" alt="Scanned Image">
                        <!-- Boxes injected here -->
                    </div>
                    <button id="reset-btn" class="reset-btn">
                        <span class="material-symbols-outlined">restart_alt</span> Scan Another
                    </button>
                </div>
                
                <div class="data-panel">
                    <h3>Scan Results</h3>
                    <div id="loading-spinner" class="loading-spinner hidden">
                        <span class="material-symbols-outlined rotating">sync</span>
                        <p>Analyzing fabric and extracting items...</p>
                    </div>
                    <div id="results-content" class="results-content">
                        <!-- dynamic content goes here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js?v=4"></script>
</body>

</html>
